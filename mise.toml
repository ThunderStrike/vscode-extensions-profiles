[tools]
node = "latest"

# VSCode Extension Development Tasks
[tasks.version]
description = "Generate changelog and stage it for commit"
run = "auto-changelog -p && git add CHANGELOG.md"

[tasks.prepackage]
description = "Placeholder for prepackage task"
run = "echo 'Prepackage task - add your prepackage commands here'"

[tasks.vscode_prepublish]
description = "Prepare extension for VS Code marketplace publishing"
run = "mise run prepackage && mise run compile"

[tasks.compile]
description = "Compile TypeScript files"
run = "rm -rf ./out && tsc -p ./"

[tasks.lint]
description = "Lint TypeScript source files"
run = "eslint src --ext ts"

[tasks.watch]
description = "Watch and compile TypeScript files"
run = "tsc -watch -p ./"

[tasks.pretest]
description = "Prepare for testing by compiling and linting"
run = "mise run compile && mise run lint"

[tasks.test]
description = "Run VSCode extension tests"
run = "vscode-test"

# Lifecycle Hook Tasks (Auto-handle pre/post behaviors)
[tasks.test_with_hooks]
description = "Run tests with automatic pre-test lifecycle (compile + lint + test)"
run = "mise run pretest && mise run test"

[tasks.publish]
description = "Prepare for publishing with automatic vscode:prepublish lifecycle"
run = "mise run vscode_prepublish"

[tasks.version_bump]
description = "Run version lifecycle hook (generate changelog and stage)"
run = "mise run version"

[tasks.dev]
description = "Development workflow: compile and watch"
run = "mise run compile && mise run watch"

[tasks.ci]
description = "CI/CD workflow: full build and test pipeline"
run = "mise run compile && mise run lint && mise run test"

# System Dependencies (Linux-specific)
[tasks.install_vscode_test_deps]
description = "Install VSCode test dependencies (Linux)"
quiet = true
run = "echo 'Install VSCode test dependencies' && sudo apt-get install libnss3 libasound2t64 -y"

[tasks.uninstall_vscode_test_deps]
description = "Uninstall VSCode test dependencies and clean up (Linux)"
quiet = true
run = "echo 'Uninstalling VSCode test dependencies and cleaning up' && sudo apt-get remove libnss3 libasound2t64 -y && sudo apt-get autoremove -y"
